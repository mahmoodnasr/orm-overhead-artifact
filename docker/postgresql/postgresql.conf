# PostgreSQL Configuration for TPC-H Benchmark
# Near-default configuration with minor tuning per paper

# Connection Settings
listen_addresses = '*'
max_connections = 200
port = 5432

# Memory Settings
# 3GB, not the 4GB the other systems' caches are set to, and the difference is
# what makes the *totals* match rather than the labels.
#
# shared_buffers caps only the buffer cache. work_mem is charged per participant
# per node on top of it, and at 8 workers one parallel hash join claims
# 9 x 128MB = 1.15GB. With shared_buffers at 4GB that is 5.15GB of
# non-reclaimable memory inside a 6GB container, leaving almost nothing for page
# cache -- and the kernel thrashed: /sys/fs/cgroup/memory.events reported the
# limit hit 503,365 times during a single validation pass, with no OOM kills but
# continuous reclaim.
#
# SQL Server never met that constraint. Its max server memory of 4096 MB covers
# workspace as well as cache, so its whole footprint was 4.89GB and it had
# headroom to spare. Running PostgreSQL under memory pressure that its
# comparator did not experience is a worse inequality than a mismatched label.
#
# At 3GB: 3 + 1.15 + page cache lands near 5GB, close to SQL Server's measured
# 4.89GB, and the pressure disappears. See docs/ENVIRONMENT.md.
shared_buffers = 3GB
effective_cache_size = 8GB
# 128MB, halved when parallelism went from 2 workers to 8.
#
# work_mem is per participant per node, not per query. At the old setting a
# parallel hash join could claim work_mem x (workers + leader): 3 x 256MB =
# 768MB at 2 workers, but 9 x 256MB = 2.3GB at 8. That broke two ways at once.
# It exceeded the container's /dev/shm, where PostgreSQL puts the dynamic shared
# memory a parallel hash lives in, and Q04 and Q21 failed validation with
# "could not resize shared memory segment" - a segment asking for exactly 2 GB
# against a 2 GB tmpfs. And it quietly handed PostgreSQL more memory than any
# other system in the study: SQL Server's 4096 MB ceiling covers its workspace
# as well as its cache, whereas shared_buffers + unbounded work_mem does not.
#
# 128MB x 9 participants = 1.15GB per node, close to the 768MB the original
# 2-worker campaign allowed, so the configuration stays comparable to both the
# earlier PostgreSQL numbers and to SQL Server's budget.
work_mem = 128MB
maintenance_work_mem = 1GB

# Query Planner
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL Settings
wal_buffers = 16MB
checkpoint_completion_target = 0.9

# Logging
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'none'
log_duration = off
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Locale Settings
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# --- Parallelism -------------------------------------------------------------
# Set to match SQL Server's MAXDOP 8 and Oracle's parallel degree 8, so the
# three systems capable of intra-query parallelism all run at 8. MySQL is not
# among them and runs at 1: its executor is single-threaded by design, and
# innodb_parallel_read_threads reaches only bare scans. Measured, not assumed --
# see docs/PARALLELISM.md for the A/B that establishes it.
#
# These were previously unset, so PostgreSQL ran at its default of 2 workers per
# gather while SQL Server ran at 8. That is why the PostgreSQL campaign is being
# re-measured rather than kept.
#
# Note when comparing the numbers: max_parallel_workers_per_gather counts
# background workers *excluding* the leader, and parallel_leader_participation
# is on by default, so PostgreSQL at 8 can place up to nine processes on a query
# where SQL Server's MAXDOP 8 places eight.
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_workers_per_gather = 8
max_parallel_maintenance_workers = 8
